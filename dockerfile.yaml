FROM alpine:latest

# Install only the tools you specified
RUN apk add --no-cache \
    # HTTP clients
    curl \
    wget \
    # Network utilities
    iproute2 \
    iputils \
    net-tools \
    # DNS tools
    bind-tools \
    # Port scanning
    nmap \
    nmap-ncat \
    # Additional useful tools
    tcpdump \
    traceroute \
    mtr \
    busybox-extras \
    bash \
    # TLS support
    ca-certificates \
    openssl

# Create a non-root user for security
RUN addgroup -g 1000 netdebug && \
    adduser -D -u 1000 -G netdebug netdebug

# Set working directory
WORKDIR /home/netdebug

# Switch to non-root user (optional, comment out if you need root)
USER netdebug

# Keep container running
CMD ["/bin/bash"]
